name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Arrange files into folders
        run: |
          mkdir -p native www
          mv JuiceVaultPlugin.java KeepAliveService.java MainActivity.java patch.py native/
          mv index.html www/

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Patch in native code, permissions and service
        run: python3 native/patch.py

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: JuiceVault-Studio-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
